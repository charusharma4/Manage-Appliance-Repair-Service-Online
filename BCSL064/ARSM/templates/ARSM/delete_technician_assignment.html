<!--Delete assignment-->
{% extends "ARSM/base.html" %}

{% block title %}Delete Technician Assignment{% endblock %}

{% block content %}
<div class="delete-wrapper">
    <div class="delete-box">
        
        <div class="icon">⚠️</div>

        <h2>Delete Technician Assignment</h2>
        <p>
            This action cannot be undone.  
            Are you sure you want to permanently delete this Technician Assignment?
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="btns">
                <button type="submit" class="delete-btn">
                    Delete
                </button>

                <a href="{% url 'technician_assignment_list' %}" class="cancel-btn">
                    Cancel
                </a>
            </div>
        </form>

    </div>
</div>
{% endblock %}
