{% extends "ARSM/base.html" %}
{% block content %}

<h2 class="title1">Update Complaint</h2>

<div class="update">
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </div>
    </form>
</div>

{% endblock %}
