<!--Create notification-->
{% extends "ARSM/base.html" %}
{% block title %}notification{% endblock %}
{% block content %}
<div class="form-container">
    <h2 class="form-title">Add Notification</h2>
    <form method='POST' class="appliance-form">
        {% csrf_token %}
    
        <label>User Id</label>
        {{ form.user_id }}
        
        <label>Title</label>
        {{ form.title }}
        
        <label>Message</label>
        {{ form.msg }}

        <label>Type</label>
        {{ form.type }}

        <button type="submit">Send Notification</button>
    </form>
</div>

{% endblock %}
